name: MOTM announcement fallback

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: motm-announcement-fallback
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check automatic MOTM announcement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajaxpro-motm-announcement" \
            | jq -r '.value')"
          test -n "${oidc_token}"
          test "${oidc_token}" != "null"
          result="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${oidc_token}" \
            "https://ajaxpro.fans/api/next-match?view=motm-announcement")"
          echo "${result}"
          active="$(jq -er '.active | if type == "boolean" then tostring else error("Missing active flag") end' <<< "${result}")"
          if [[ "${active}" == "false" ]]; then
            state="$(gh api "repos/${GH_REPO}/actions/workflows/motm-announcement.yml" --jq '.state')"
            if [[ "${state}" == "active" ]]; then
              gh workflow disable motm-announcement.yml
            fi
          fi
