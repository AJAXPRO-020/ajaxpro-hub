name: MOTM matchday planner

on:
  schedule:
    # 06:17 CET / 07:17 CEST; avoid the busy start of the hour.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: motm-announcement-fallback
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enable checks only on match days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ajaxpro-motm-announcement" \
            | jq -r '.value')"
          test -n "${oidc_token}"
          test "${oidc_token}" != "null"
          result="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${oidc_token}" \
            "https://ajaxpro.fans/api/next-match?view=motm-announcement&plan=1")"
          echo "${result}"
          active="$(jq -er '.active | if type == "boolean" then tostring else error("Missing active flag") end' <<< "${result}")"
          state="$(gh api "repos/${GH_REPO}/actions/workflows/motm-announcement.yml" --jq '.state')"
          if [[ "${active}" == "true" ]]; then
            if [[ "${state}" != "active" ]]; then
              gh workflow enable motm-announcement.yml
            fi
          elif [[ "${state}" == "active" ]]; then
            gh workflow disable motm-announcement.yml
          fi
