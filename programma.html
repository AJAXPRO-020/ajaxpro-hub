<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajax-programma | AjaxPro</title>
    <meta name="description" content="Bekijk het actuele Ajax-programma met datums, competities en tv-informatie.">
    <meta name="theme-color" content="#05070d">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="./Favicon/favicon.ico" sizes="any">
    <link rel="stylesheet" href="./styles.css?v=20260824-program">
    <link rel="stylesheet" href="./programma.css?v=20260830-priority3">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="program-page">
    <header class="site-header program-header">
      <a class="brand" href="./" aria-label="AjaxPro home"><img src="./assets/ajaxpro-logo.png" alt="AjaxPro"></a>
      <a class="program-back" href="./">← Terug</a>
    </header>
    <main>
      <section class="program-hero section-shell" aria-labelledby="program-title">
        <h1 id="program-title">Programma</h1>
        <p class="program-hero__lead">De komende wedstrijden van Ajax. Hoe dichterbij de aftrap, hoe meer je ziet.</p>
      </section>
      <section class="program-content section-shell" aria-live="polite">
        <div class="program-tabs" role="tablist" aria-label="Programmaonderdelen">
          <button type="button" role="tab" id="tab-wedstrijden" aria-controls="panel-wedstrijden" aria-selected="true" data-program-tab="wedstrijden">Wedstrijden</button>
          <button type="button" role="tab" id="tab-persconferenties" aria-controls="panel-persconferenties" aria-selected="false" data-program-tab="persconferenties">Persconferenties</button>
        </div>
        <div id="panel-wedstrijden" role="tabpanel" aria-labelledby="tab-wedstrijden" data-program-panel="wedstrijden">
          <p class="program-status" data-program-status>Programma laden…</p>
          <div class="program-list" data-program-list></div>
        </div>
        <div id="panel-persconferenties" role="tabpanel" aria-labelledby="tab-persconferenties" data-program-panel="persconferenties" hidden>
          <div class="press-toolbar"><p class="program-status" data-press-status>Persconferenties laden…</p><button class="press-check" type="button" data-press-check hidden>Nu controleren</button></div>
          <div class="press-list" data-press-list></div>
          <p class="press-checked" data-press-checked></p>
        </div>
      </section>
    </main>
    <script src="./programma.js?v=20260830-priority"></script>
    <script src="./persconferenties.js?v=1"></script>
  </body>
</html>
